<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="프롬프트">
<title>프롬프트 라이브러리</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Pretendard:wght@300;400;500;600&display=swap');

:root {
  --bg:  #0a0a0a; --bg2: #111; --bg3: #1a1a1a; --bg4: #222;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
  --text: #f0f0f0; --text2: #888; --text3: #444;
  --accent: #c8f264; --accent2: #a8d444;
  --r: 10px; --r2: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, sans-serif; min-height: 100svh; overscroll-behavior: none; }

/* TOPBAR */
.topbar { position: sticky; top: 0; z-index: 50; background: rgba(10,10,10,0.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); padding: 14px 16px 12px; }
.topbar-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.app-title { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: .06em; }
.topbar-actions { display: flex; gap: 8px; }
.icon-btn { width: 34px; height: 34px; border: 1px solid var(--border2); border-radius: var(--r); background: var(--bg3); color: var(--text2); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.icon-btn:hover { background: var(--bg4); color: var(--text); }
.add-btn { height: 34px; padding: 0 16px; border: 1px solid var(--accent); border-radius: var(--r); background: transparent; color: var(--accent); font-family: 'Pretendard', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
.add-btn:hover { background: var(--accent); color: #0a0a0a; }
.search-wrap { position: relative; }
.search-input { width: 100%; padding: 9px 14px 9px 36px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r); color: var(--text); font-size: 14px; font-family: 'Pretendard', sans-serif; transition: border-color .15s; }
.search-input:focus { outline: none; border-color: var(--border2); }
.search-input::placeholder { color: var(--text3); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; pointer-events: none; }

/* TAG FILTER */
.tag-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px 0; scrollbar-width: none; }
.tag-scroll::-webkit-scrollbar { display: none; }
.tag-pill { flex-shrink: 0; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; color: var(--text2); background: transparent; cursor: pointer; transition: all .15s; font-family: 'Pretendard', sans-serif; white-space: nowrap; }
.tag-pill:hover { border-color: var(--border2); color: var(--text); }
.tag-pill.active { background: var(--bg4); border-color: var(--border2); color: var(--text); }

/* VIEW TOGGLE */
.view-toggle { display: flex; gap: 4px; padding: 10px 16px 0; }
.vt-btn { padding: 5px 12px; font-size: 12px; border: 1px solid var(--border); border-radius: var(--r); background: transparent; color: var(--text3); cursor: pointer; font-family: 'DM Mono', monospace; transition: all .15s; }
.vt-btn.active { background: var(--bg3); border-color: var(--border2); color: var(--text2); }

/* CONTENT */
.content { padding: 12px 16px 120px; }
.count-label { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; letter-spacing: .05em; margin-bottom: 12px; min-height: 18px; }

/* LIST VIEW */
.cards-list { display: flex; flex-direction: column; gap: 8px; }

/* GRID VIEW */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }

/* CARD BASE */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2); cursor: pointer; transition: border-color .15s, background .15s, transform .1s; position: relative; overflow: hidden; }
.card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(200,242,100,.2), transparent); opacity: 0; transition: opacity .2s; }
.card:hover { border-color: var(--border2); background: var(--bg3); }
.card:hover::after { opacity: 1; }
.card:active { transform: scale(0.99); }

/* LIST CARD */
.card-list { padding: 14px 16px; }
.card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.card-title { flex: 1; font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.4; }
.tag-badge { flex-shrink: 0; font-size: 10px; padding: 3px 8px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.tb-image { background: #1a2a1a; color: #7ed87e; }
.tb-video { background: #2a1a0a; color: #f0a050; }
.tb-vibe  { background: #0a1a2a; color: #60b4f0; }
.tb-nano  { background: #1a0a2a; color: #c080f0; }
.tb-etc   { background: #1c1c1c; color: #888; }
.card-preview { font-size: 12px; color: var(--text3); line-height: 1.6; font-family: 'DM Mono', monospace; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.card-date { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.card-actions { display: flex; gap: 6px; }
.c-btn { padding: 4px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text2); cursor: pointer; font-family: 'Pretendard', sans-serif; transition: all .15s; }
.c-btn:hover { border-color: var(--border2); color: var(--text); background: var(--bg4); }
.c-btn.copy:hover { border-color: var(--accent); color: var(--accent); }
.c-btn.del:hover  { border-color: #c0392b; color: #e74c3c; }

/* GRID CARD */
.card-grid { display: flex; flex-direction: column; }
.card-grid-thumb { width: 100%; aspect-ratio: 1; background: var(--bg3); position: relative; overflow: hidden; border-radius: var(--r2) var(--r2) 0 0; }
.card-grid-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-grid-thumb .no-img { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); }
.card-grid-info { padding: 10px 12px 12px; }
.card-grid-title { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-grid-bottom { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card-grid-tag { font-size: 10px; padding: 2px 7px; border-radius: 999px; }
.card-grid-date { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; }

/* EMPTY */
.empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 13px; line-height: 2.2; }
.empty-icon { font-size: 36px; margin-bottom: 8px; opacity: .35; }

/* MODAL */
.modal-bg { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.72); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; animation: fadein .15s; padding: 20px; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--r2); padding: 24px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; animation: popin .2s cubic-bezier(.32,1,.48,1); }
@keyframes popin { from { transform: scale(0.96) translateY(8px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
@media (max-width: 480px) {
  .modal-bg { align-items: flex-end; padding: 0; }
  .modal { border-radius: var(--r2) var(--r2) 0 0; max-width: 100%; max-height: 92svh; padding: 20px 20px calc(env(safe-area-inset-bottom) + 36px); }
}
.handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 20px; }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
.form-label { display: block; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 6px; }
.form-input { width: 100%; padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r); color: var(--text); font-size: 14px; font-family: 'Pretendard', sans-serif; margin-bottom: 16px; transition: border-color .15s; }
.form-input:focus { outline: none; border-color: var(--accent); }
textarea.form-input { font-family: 'DM Mono', monospace; font-size: 12px; line-height: 1.75; resize: vertical; min-height: 140px; }
.tag-options { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.tag-opt { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; color: var(--text2); background: transparent; cursor: pointer; transition: all .15s; font-family: 'Pretendard', sans-serif; }
.tag-opt.on-image { background: #1a2a1a; color: #7ed87e; border-color: #2a4a2a; }
.tag-opt.on-video { background: #2a1a0a; color: #f0a050; border-color: #4a2a0a; }
.tag-opt.on-vibe  { background: #0a1a2a; color: #60b4f0; border-color: #0a2a4a; }
.tag-opt.on-nano  { background: #1a0a2a; color: #c080f0; border-color: #2a0a4a; }
.tag-opt.on-etc   { background: #1c1c1c; color: #aaa;    border-color: #333; }
.modal-btns { display: flex; gap: 8px; }
.btn-primary { flex: 1; padding: 13px; background: var(--accent); color: #0a0a0a; border: none; border-radius: var(--r); font-size: 14px; font-weight: 600; font-family: 'Pretendard', sans-serif; cursor: pointer; transition: background .15s; }
.btn-primary:hover { background: var(--accent2); }
.btn-secondary { padding: 13px 20px; background: transparent; color: var(--text2); border: 1px solid var(--border); border-radius: var(--r); font-size: 14px; font-family: 'Pretendard', sans-serif; cursor: pointer; }

/* IMAGE UPLOAD */
.img-upload-area { width: 100%; height: 120px; border: 1px dashed var(--border2); border-radius: var(--r); background: var(--bg3); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 16px; transition: border-color .15s; position: relative; overflow: hidden; }
.img-upload-area:hover { border-color: var(--accent); }
.img-upload-area img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: var(--r); }
.img-upload-hint { font-size: 12px; color: var(--text3); text-align: center; line-height: 2; pointer-events: none; position: relative; z-index: 1; }
.img-upload-area.has-img .img-upload-hint { display: none; }
.img-clear-btn { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.7); border: 1px solid var(--border2); color: var(--text2); font-size: 14px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 2; transition: all .15s; }
.img-upload-area.has-img .img-clear-btn { display: flex; }
.img-clear-btn:hover { background: rgba(180,30,30,.8); color: #fff; }
.img-expand-btn { position: absolute; bottom: 8px; right: 8px; padding: 3px 10px; border-radius: 6px; background: rgba(0,0,0,.7); border: 1px solid var(--border2); color: var(--text2); font-size: 11px; cursor: pointer; display: none; align-items: center; z-index: 2; font-family: 'Pretendard', sans-serif; transition: all .15s; }
.img-upload-area.has-img .img-expand-btn { display: flex; }
.img-expand-btn:hover { background: rgba(0,0,0,.9); color: var(--text); }

/* FULLSCREEN IMAGE VIEWER */
.img-viewer { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
.img-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: var(--r); }
.img-viewer-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* DETAIL */
.detail-img { width: 100%; border-radius: var(--r); margin-bottom: 16px; object-fit: contain; border: 1px solid var(--border); display: block; background: var(--bg3); max-height: 200px; }
.detail-body { font-family: 'DM Mono', monospace; font-size: 12px; line-height: 1.8; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 16px; word-break: break-all; white-space: pre-wrap; max-height: 260px; overflow-y: auto; }
.detail-copy { width: 100%; padding: 13px; background: var(--accent); color: #0a0a0a; border: none; border-radius: var(--r); font-size: 14px; font-weight: 600; font-family: 'Pretendard', sans-serif; cursor: pointer; margin-bottom: 8px; transition: background .15s; }
.detail-copy:hover { background: var(--accent2); }

/* SETTINGS */
.settings-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity .15s; }
.settings-row:hover { opacity: .8; }
.settings-row:last-child { border-bottom: none; }
.s-icon { width: 42px; height: 42px; border-radius: var(--r); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.s-label { font-size: 14px; font-weight: 500; color: var(--text); }
.s-desc  { font-size: 12px; color: var(--text3); margin-top: 2px; }
.tip-box { margin-top: 16px; padding: 12px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r); font-size: 12px; color: var(--text3); line-height: 1.8; }

/* STORAGE BAR */
.storage-bar-wrap { margin-top: 12px; }
.storage-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; margin-bottom: 6px; }
.storage-bar { width: 100%; height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
.storage-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }

/* TOAST */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--accent); color: #0a0a0a; font-size: 13px; font-weight: 600; font-family: 'Pretendard', sans-serif; padding: 9px 22px; border-radius: 999px; opacity: 0; transition: all .2s; pointer-events: none; z-index: 999; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* FAB */
.fab { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 20px); right: 20px; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); border: none; color: #0a0a0a; font-size: 26px; cursor: pointer; box-shadow: 0 4px 24px rgba(200,242,100,.35); display: none; align-items: center; justify-content: center; transition: transform .15s; z-index: 40; }
.fab:hover { transform: scale(1.06); }
@media (max-width: 480px) { .fab { display: flex; } .add-btn { display: none; } }
input[type="file"] { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row1">
    <div class="app-title">PROMPT.LIB</div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="openSettings()">⚙</button>
      <button class="add-btn" onclick="openAdd()">+ 추가</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" type="search" id="searchInput" placeholder="제목, 내용 검색..." oninput="render()">
  </div>
</div>

<div class="tag-scroll" id="tagScroll"></div>
<div class="view-toggle">
  <button class="vt-btn active" id="vtList" onclick="setView('list')">≡ 목록</button>
  <button class="vt-btn" id="vtGrid" onclick="setView('grid')">⊞ 갤러리</button>
</div>

<div class="content">
  <div class="count-label" id="countLabel"></div>
  <div id="cards"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="empty-icon">📭</div>
    프롬프트가 없어요<br>+ 버튼으로 추가해보세요
  </div>
</div>

<button class="fab" onclick="openAdd()">+</button>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json" onchange="importJSON(event)">
<input type="file" id="imgPicker" accept="image/*" onchange="onImgPicked(event)">

<script>
/* ── TAGS ── */
const TAGS = [
  {id:'image',label:'이미지 생성',short:'이미지'},
  {id:'video',label:'영상 생성',  short:'영상'},
  {id:'vibe', label:'바이브코딩', short:'바이브'},
  {id:'nano', label:'나노바나나', short:'나노'},
  {id:'etc',  label:'기타',       short:'기타'}
];

/* ── STATE ── */
let prompts=[], activeTag='all', selTag='image', editId=null, viewMode='list', pendingImg=null;

/* ── INDEXEDDB ── */
const DB_NAME='promptlib', DB_VER=1, STORE='prompts';
let db;

function openDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, {keyPath:'id'});
    req.onsuccess = e => { db=e.target.result; res(db); };
    req.onerror   = e => rej(e.target.error);
  });
}
function dbGetAll(){
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = ()=>res(req.result);
    req.onerror   = e=>rej(e.target.error);
  });
}
function dbPut(item){
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    const req = tx.objectStore(STORE).put(item);
    req.onsuccess = ()=>res();
    req.onerror   = e=>rej(e.target.error);
  });
}
function dbDelete(id){
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = ()=>res();
    req.onerror   = e=>rej(e.target.error);
  });
}
function dbClear(){
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    const req = tx.objectStore(STORE).clear();
    req.onsuccess = ()=>res();
    req.onerror   = e=>rej(e.target.error);
  });
}

/* ── HELPERS ── */
const tagInfo = id => TAGS.find(t=>t.id===id)||TAGS[4];
const dateStr = ()=> new Date().toLocaleDateString('ko-KR',{month:'short',day:'numeric'});
const uid     = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc     = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ── RENDER ── */
function render(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  const list=prompts.filter(p=>{
    if(activeTag!=='all'&&p.tag!==activeTag)return false;
    if(!q)return true;
    return p.title.toLowerCase().includes(q)||p.content.toLowerCase().includes(q);
  });
  const cardsEl=document.getElementById('cards');
  const emptyEl=document.getElementById('empty');
  document.getElementById('countLabel').textContent=list.length?`${list.length}개`:'';
  if(!list.length){cardsEl.innerHTML='';emptyEl.style.display='block';return;}
  emptyEl.style.display='none';

  if(viewMode==='grid'){
    cardsEl.className='cards-grid';
    cardsEl.innerHTML=list.map(p=>{
      const t=tagInfo(p.tag);
      const thumb=p.image
        ?`<img src="${p.image}" loading="lazy">`
        :`<div class="no-img">no image</div>`;
      return `<div class="card card-grid" onclick="openDetail('${p.id}')">
        <div class="card-grid-thumb">${thumb}</div>
        <div class="card-grid-info">
          <div class="card-grid-title">${esc(p.title)}</div>
          <div class="card-grid-bottom">
            <span class="card-grid-tag tag-badge tb-${p.tag}">${t.short}</span>
            <span class="card-grid-date">${p.date}</span>
          </div>
        </div>
      </div>`;
    }).join('');
  } else {
    cardsEl.className='cards-list';
    cardsEl.innerHTML=list.map(p=>{
      const t=tagInfo(p.tag);
      const thumbBar=p.image
        ?`<div style="width:52px;height:52px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1px solid var(--border)"><img src="${p.image}" style="width:100%;height:100%;object-fit:cover"></div>`
        :'';
      return `<div class="card card-list" onclick="openDetail('${p.id}')">
        <div style="display:flex;gap:12px;align-items:flex-start">
          ${thumbBar}
          <div style="flex:1;min-width:0">
            <div class="card-header">
              <div class="card-title">${esc(p.title)}</div>
              <span class="tag-badge tb-${p.tag}">${t.short}</span>
            </div>
            <div class="card-preview">${esc(p.content.replace(/\n/g,' '))}</div>
            <div class="card-footer">
              <span class="card-date">${p.date}</span>
              <div class="card-actions" onclick="event.stopPropagation()">
                <button class="c-btn copy" onclick="copyById('${p.id}')">복사</button>
                <button class="c-btn" onclick="openEdit('${p.id}')">편집</button>
                <button class="c-btn del" onclick="del('${p.id}')">삭제</button>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  }
}

function renderTags(){
  const counts=Object.fromEntries(TAGS.map(t=>[t.id,prompts.filter(p=>p.tag===t.id).length]));
  const all=`<button class="tag-pill ${activeTag==='all'?'active':''}" onclick="setTag('all')">전체 ${prompts.length}</button>`;
  const pills=TAGS.filter(t=>counts[t.id]>0).map(t=>
    `<button class="tag-pill ${activeTag===t.id?'active':''}" onclick="setTag('${t.id}')">${t.label} ${counts[t.id]}</button>`
  ).join('');
  document.getElementById('tagScroll').innerHTML=all+pills;
}
function setTag(id){activeTag=id;renderTags();render();}
function setView(v){
  viewMode=v;
  document.getElementById('vtList').className='vt-btn'+(v==='list'?' active':'');
  document.getElementById('vtGrid').className='vt-btn'+(v==='grid'?' active':'');
  render();
}

/* ── MODAL ── */
function showModal(html){
  closeModal();
  const bg=document.createElement('div');
  bg.className='modal-bg';bg.id='modalBg';
  bg.onclick=e=>{if(e.target===bg)closeModal();};
  bg.innerHTML=`<div class="modal"><div class="handle"></div>${html}</div>`;
  document.body.appendChild(bg);
}
function closeModal(){const m=document.getElementById('modalBg');if(m)m.remove();}

/* ── ADD / EDIT ── */
function openAdd(){editId=null;selTag='image';pendingImg=null;renderForm();}
function openEdit(id){
  const p=prompts.find(x=>x.id===id);
  editId=id;selTag=p.tag;pendingImg=p.image||null;renderForm(p);
}
function renderForm(p){
  showModal(`
    <div class="modal-title">${p?'프롬프트 편집':'새 프롬프트'}</div>
    <label class="form-label">제목</label>
    <input id="fTitle" class="form-input" type="text" placeholder="프롬프트 이름" value="${p?esc(p.title):''}">
    <label class="form-label">내용</label>
    <textarea id="fContent" class="form-input" placeholder="프롬프트 텍스트...">${p?esc(p.content):''}</textarea>
    <label class="form-label">태그</label>
    <div class="tag-options" id="tagOpts"></div>
    <label class="form-label">이미지 (선택) — 생성된 결과물을 저장해두세요</label>
    <div class="img-upload-area ${pendingImg?'has-img':''}" id="imgUploadArea" onclick="triggerImgPick()">
      ${pendingImg?`<img id="previewImg" src="${pendingImg}">`:''}
      <div class="img-upload-hint">클릭해서 이미지 추가</div>
      <button class="img-clear-btn" onclick="event.stopPropagation();clearImg()">✕</button>
      <button class="img-expand-btn" onclick="event.stopPropagation();openViewer('${pendingImg||''}')">전체보기</button>
    </div>
    <div class="modal-btns" style="margin-top:20px">
      <button class="btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="savePrompt()">저장</button>
    </div>
  `);
  renderTagOpts();
  setTimeout(()=>document.getElementById('fTitle').focus(),60);
}

function triggerImgPick(){document.getElementById('imgPicker').click();}
function onImgPicked(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    pendingImg=ev.target.result;
    const area=document.getElementById('imgUploadArea');
    if(!area)return;
    area.classList.add('has-img');
    let img=area.querySelector('img');
    if(!img){img=document.createElement('img');img.id='previewImg';area.insertBefore(img,area.firstChild);}
    img.src=pendingImg;
  };
  reader.readAsDataURL(file);
  e.target.value='';
}
function clearImg(){
  pendingImg=null;
  const area=document.getElementById('imgUploadArea');
  if(!area)return;
  area.classList.remove('has-img');
  const img=area.querySelector('img');
  if(img)img.remove();
}

function renderTagOpts(){
  const el=document.getElementById('tagOpts');if(!el)return;
  el.innerHTML=TAGS.map(t=>
    `<button class="tag-opt ${selTag===t.id?'on-'+t.id:''}" onclick="pickTag('${t.id}')">${t.label}</button>`
  ).join('');
}
function pickTag(id){selTag=id;renderTagOpts();}

async function savePrompt(){
  const title=document.getElementById('fTitle').value.trim();
  const content=document.getElementById('fContent').value.trim();
  if(!title||!content){toast('제목과 내용을 입력해주세요');return;}
  if(editId){
    const p=prompts.find(x=>x.id===editId);
    Object.assign(p,{title,content,tag:selTag,image:pendingImg||null});
    await dbPut(p);
  } else {
    const item={id:uid(),title,content,tag:selTag,image:pendingImg||null,date:dateStr()};
    prompts.unshift(item);
    await dbPut(item);
  }
  closeModal();renderTags();render();
  toast(editId?'수정했어요 ✓':'저장했어요 ✓');
}

/* ── DETAIL ── */
function openDetail(id){
  const p=prompts.find(x=>x.id===id);
  const t=tagInfo(p.tag);
  const imgHtml=p.image?`<img class="detail-img" src="${p.image}" onclick="openViewer('${p.id}')" style="cursor:zoom-in">`:'';
  showModal(`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span class="tag-badge tb-${p.tag}">${t.label}</span>
      <div class="modal-title" style="margin:0;flex:1">${esc(p.title)}</div>
    </div>
    ${imgHtml}
    <div class="detail-body">${esc(p.content)}</div>
    <button class="detail-copy" onclick="copyById('${p.id}');closeModal()">클립보드에 복사 ✓</button>
    <div style="display:flex;gap:8px">
      <button class="btn-secondary" style="flex:1" onclick="closeModal()">닫기</button>
      <button class="btn-secondary" style="flex:1" onclick="closeModal();openEdit('${p.id}')">편집</button>
    </div>
  `);
}

/* ── COPY ── */
function copyById(id){
  const p=prompts.find(x=>x.id===id);if(!p)return;
  if(navigator.clipboard) navigator.clipboard.writeText(p.content).then(()=>toast('복사됐어요 ✓')).catch(()=>fbCopy(p.content));
  else fbCopy(p.content);
}
function fbCopy(text){
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('복사됐어요 ✓');
}

/* ── DELETE ── */
async function del(id){
  if(!confirm('삭제할까요?'))return;
  prompts=prompts.filter(p=>p.id!==id);
  await dbDelete(id);
  renderTags();render();toast('삭제했어요');
}

/* ── SETTINGS ── */
function openSettings(){
  const cnt=prompts.filter(p=>p.image).length;
  const imgSize=prompts.reduce((a,p)=>a+(p.image?Math.round(p.image.length*0.75/1024):0),0);
  const pct=Math.min(100,Math.round(imgSize/500*100));
  showModal(`
    <div class="modal-title">설정 · 동기화</div>
    <div class="settings-row" onclick="exportJSON()">
      <div class="s-icon" style="background:#1a2a1a">📤</div>
      <div><div class="s-label">JSON으로 내보내기</div><div class="s-desc">이미지 포함 전체 데이터 저장</div></div>
    </div>
    <div class="settings-row" onclick="document.getElementById('importFile').click()">
      <div class="s-icon" style="background:#0a1a2a">📥</div>
      <div><div class="s-label">JSON 가져오기</div><div class="s-desc">다른 기기에서 내보낸 파일 불러오기</div></div>
    </div>
    <div class="settings-row" onclick="closeModal();pasteImport()">
      <div class="s-icon" style="background:#2a1a0a">📝</div>
      <div><div class="s-label">텍스트로 가져오기</div><div class="s-desc">JSON 텍스트 붙여넣어 동기화</div></div>
    </div>
    <div style="margin-top:16px;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r)">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:8px">
        <span>저장 현황</span><span>${prompts.length}개 프롬프트 · 이미지 ${cnt}장</span>
      </div>
      <div class="storage-bar-label"><span>이미지 용량</span><span>~${imgSize}KB</span></div>
      <div class="storage-bar"><div class="storage-bar-fill" style="width:${pct}%"></div></div>
      <div style="font-size:10px;color:var(--text3);margin-top:6px">IndexedDB 사용 중 · 브라우저 여유 공간까지 저장 가능</div>
    </div>
    <div style="margin-top:12px">
      <button class="btn-secondary" style="width:100%" onclick="closeModal()">닫기</button>
    </div>
  `);
}

/* ── EXPORT / IMPORT ── */
function exportJSON(){
  const data=prompts.map(p=>({...p}));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`prompts_${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);
  toast('내보냈어요 ✓');
}
async function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data))throw new Error();
      const existing=new Set(prompts.map(p=>p.id));
      const added=data.filter(p=>!existing.has(p.id));
      for(const item of added){ prompts.unshift(item); await dbPut(item); }
      renderTags();render();closeModal();
      toast(`${added.length}개 추가됐어요 ✓`);
    }catch(e){toast('파일 형식이 올바르지 않아요');}
    e.target.value='';
  };
  reader.readAsText(file);
}
function pasteImport(){
  showModal(`
    <div class="modal-title">텍스트로 가져오기</div>
    <label class="form-label">JSON 텍스트 붙여넣기</label>
    <textarea id="pasteArea" class="form-input" placeholder='[{"id":"...","title":"..."}]' style="min-height:160px"></textarea>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="doPaste()">가져오기</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('pasteArea').focus(),60);
}
async function doPaste(){
  try{
    const data=JSON.parse(document.getElementById('pasteArea').value.trim());
    if(!Array.isArray(data))throw new Error();
    const existing=new Set(prompts.map(p=>p.id));
    const added=data.filter(p=>!existing.has(p.id));
    for(const item of added){ prompts.unshift(item); await dbPut(item); }
    renderTags();render();closeModal();
    toast(`${added.length}개 추가됐어요 ✓`);
  }catch(e){toast('형식이 올바르지 않아요');}
}

/* ── IMAGE VIEWER ── */
function openViewer(idOrUrl){
  const src = idOrUrl.startsWith('data:') || idOrUrl.startsWith('http') || idOrUrl.startsWith('blob')
    ? idOrUrl
    : (prompts.find(x=>x.id===idOrUrl)||{}).image;
  if(!src) return;
  const v=document.createElement('div');
  v.className='img-viewer';
  v.innerHTML=`<img src="${src}"><button class="img-viewer-close" onclick="this.parentNode.remove()">✕</button>`;
  v.onclick=e=>{if(e.target===v)v.remove();};
  document.body.appendChild(v);
}

/* ── TOAST ── */
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);
}

/* ── SERVICE WORKER ── */
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

/* ── SEED ── */
const SEED=[
  {id:'seed1',title:'캐릭터 레퍼런스 시트',tag:'image',image:null,
   content:`Create a professional character reference sheet based strictly on the uploaded reference image. Use a clean, neutral plain background and present the sheet as a technical model turnaround while matching the exact realistic visual style of the reference. Arrange the composition into two horizontal rows. Top row: four full-body standing views – front, left profile, right profile, back. Bottom row: three close-up portraits – front, left profile, right profile. Maintain perfect identity consistency across every panel. Keep the subject in a relaxed A-pose with consistent scale and alignment, accurate anatomy, and clear silhouette. Lighting should be consistent across all panels. Output a crisp, ultra-realistic, print-ready reference sheet.`,
   date:dateStr()}
];

/* ── INIT ── */
openDB().then(async()=>{
  prompts=await dbGetAll();
  prompts.sort((a,b)=>b.id.localeCompare(a.id));
  if(prompts.length===0){
    for(const s of SEED){ prompts.push(s); await dbPut(s); }
  }
  renderTags();render();
});
</script>
